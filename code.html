  <header class="topbar"><div class="topbar-inner"><button class="brand" type="button" data-view="harian" aria-label="NutriCalc, ke halaman Harian"><span class="brand-mark" aria-hidden="true">N</span><span><span class="brand-name">NutriCalc</span><span class="brand-sub" id="brand-sub">Harian</span></span></button><div class="top-actions"><span class="streak" aria-label="Catatan beruntun"><span aria-hidden="true">↗</span><span id="streak-count">0 Hari</span></span><button class="profile-shortcut" type="button" data-view="profil" aria-label="Buka profil">⌂</button></div></div></header>

  <div id="toast-slot" aria-live="polite"></div>
  <script>
    (()=>{
      'use strict';
      const STORE={entries:'nutricalc.entries.v1',profile:'nutricalc.profile.v1',custom:'nutricalc.custom.v1'};
      const meals=[{id:'sarapan',name:'Sarapan',time:'07:00 - 09:00',icon:'◒'},{id:'siang',name:'Makan Siang',time:'12:00 - 14:00',icon:'◉'},{id:'malam',name:'Makan Malam',time:'18:30 - 20:30',icon:'◐'},{id:'camilan',name:'Camilan',time:'Di luar waktu makan',icon:'○'}];
      const catalog=[
        {id:'nasi-merah',name:'Nasi merah',serving:'1 porsi (150 g)',kcal:165,carbs:35,protein:3.5,fat:1.2,icon:'▤'},
        {id:'nasi-putih',name:'Nasi putih',serving:'1 porsi (150 g)',kcal:195,carbs:43,protein:3.6,fat:.4,icon:'▤'},
        {id:'telur-rebus',name:'Telur rebus',serving:'1 butir',kcal:90,carbs:1,protein:7,fat:6,icon:'◉'},
        {id:'ayam-panggang',name:'Ayam panggang',serving:'1 potong (100 g)',kcal:165,carbs:0,protein:31,fat:3.6,icon:'◈'},
        {id:'tempe',name:'Tempe goreng',serving:'2 potong (80 g)',kcal:190,carbs:9,protein:15,fat:10,icon:'▦'},
        {id:'tahu',name:'Tahu putih',serving:'2 potong (100 g)',kcal:80,carbs:2,protein:8,fat:5,icon:'▦'},
        {id:'oatmeal-pisang',name:'Oatmeal & pisang',serving:'1 mangkuk',kcal:250,carbs:48,protein:8,fat:4,icon:'◍'},
        {id:'sayur-bayam',name:'Sayur bayam bening',serving:'1 mangkuk',kcal:45,carbs:7,protein:3,fat:.5,icon:'◌'},
        {id:'soto-ayam',name:'Soto ayam',serving:'1 mangkuk',kcal:180,carbs:15,protein:16,fat:6,icon:'◍'},
        {id:'pisang',name:'Pisang ambon',serving:'1 buah sedang',kcal:95,carbs:24,protein:1.1,fat:.3,icon:'◖'},
        {id:'apel',name:'Apel',serving:'1 buah sedang',kcal:95,carbs:25,protein:.5,fat:.3,icon:'◉'},
        {id:'gado-gado',name:'Gado-gado',serving:'1 porsi',kcal:318,carbs:28,protein:13,fat:17,icon:'◍'},
        {id:'pecel',name:'Pecel sayur',serving:'1 porsi',kcal:280,carbs:32,protein:12,fat:12,icon:'◍'},
        {id:'susu',name:'Susu rendah lemak',serving:'1 gelas (200 ml)',kcal:100,carbs:12,protein:7,fat:3,icon:'▯'},
        {id:'roti',name:'Roti gandum',serving:'2 lembar',kcal:140,carbs:24,protein:6,fat:2,icon:'▱'}
      ];
      const today=dateKey(new Date());
      const sample=[seedEntry('oatmeal-pisang','sarapan',today),seedEntry('telur-rebus','sarapan',today,2),seedEntry('nasi-merah','siang',today),seedEntry('ayam-panggang','siang',today),seedEntry('tempe','siang',today),seedEntry('soto-ayam','malam',today),seedEntry('pisang','malam',today)];
      let entries=readStore(STORE.entries,null);if(!Array.isArray(entries)){entries=sample;writeStore(STORE.entries,entries)}
      let profile=readStore(STORE.profile,{calories:2100,carbs:250,protein:130,fat:65,mode:'manual',name:''});
      let customFoods=readStore(STORE.custom,[]),favorites=readStore('nutricalc.favorites.v1',[]),activeView='harian',selectedDate=today,activeFilter='semua';
      let openMeals=new Set(meals.map(meal=>meal.id)),undoEntry=null,toastTimer;
      const app=document.getElementById('app'),entryDialog=document.getElementById('entry-dialog'),customDialog=document.getElementById('custom-dialog');
      function dateKey(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`}
      function fromKey(key){const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d)}
      function shiftDate(key,amount){const date=fromKey(key);date.setDate(date.getDate()+amount);return dateKey(date)}

      function renderDashboard(){const list=dayEntries(),total=totals(list),caloriePct=profile.calories>0?total.kcal/profile.calories:0;const dateLabel=selectedDate===today?'Hari Ini':selectedDate===shiftDate(today,-1)?'Kemarin':selectedDate===shiftDate(today,1)?'Besok':prettyDate(selectedDate);

t</h3><p>Barcode · input manual tersedia</p></div><button type="button" data-open-scan>Pindai&nbsp; →</button></section></div></div><p class="disclaimer">NutriCalc memberikan perkiraan kebutuhan dan asupan gizi untuk informasi umum, bukan pengganti saran medis atau ahli gizi profesional. Konsultasikan dengan tenaga kesehatan sebelum mengubah pola makan jika Anda berusia di bawah 18 tahun, hamil atau menyusui, memiliki kondisi medis, atau riwayat gangguan makan.</p>`;

      function macroCard(label,used,target){const percent=target>0?used/target*100:0;return`<div class="macro"><div class="macro-head"><span class="macro-name">${label}</span><span class="macro-percent">${Math.round(percent)}%</span></div><div class="track"><div class="fill" style="width:${Math.min(percent,100)}%"></div></div><div class="macro-value">${fmt(used,1)}<span>/ ${fmt(target,1)} g</span></div></div>`}

      function mealCard(meal,list){const mealList=list.filter(entry=>entry.meal===meal.id),sum=totals(mealList),opened=openMeals.has(meal.id);return`<section class="panel meal-card ${opened?'':'closed'}"><button type="button" class="meal-toggle" data-toggle-meal="${meal.id}" aria-expanded="${opened}"><span class="meal-title"><span class="meal-icon" aria-hidden="true">${meal.icon}</span><span><span class="meal-name-row"><h3>${meal.name}</h3><span class="meal-time">${meal.time}</span></span><span class="meal-count">${mealList.length} hidangan dicatat</span></span></span><span class="meal-total">${fmt(sum.kcal)} <small>kkal</small><span class="chevron" aria-hidden="true">⌄</span></span></button><div class="meal-content"><div class="meal-divider"></div>${mealList.length?mealList.map(foodRow).join(''):'<div class="empty-meal">Belum ada catatan untuk waktu makan ini.</div>'}<button type="button" class="add-meal" data-add-meal="${meal.id}">＋&nbsp; Tambah ke ${meal.name}</button></div></section>`}

      function renderFoodResults(foods){let filtered=foods;if(activeFilter==='buatan')filtered=filtered.filter(food=>food.custom);if(activeFilter==='favorit')filtered=filtered.filter(food=>food.favorite);if(activeFilter==='terakhir'){const recent=[...entries].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(entry=>entry.foodId),ids=[...new Set(recent)];filtered=ids.map(id=>filtered.find(food=>food.id===id)).filter(Boolean)}if(!filtered.length)return'<div class="empty-state"><strong>Tidak ada makanan ditemukan</strong>Coba kata kunci lain atau tambahkan makanan kustom.</div>';return filtered.map(food=>`<button class="food-result" type="button" data-select-food="${escapeHtml(food.id)}"><span class="food-main"><span class="food-mark" aria-hidden="true">${food.icon||'◍'}</span><span class="food-copy"><span class="food-name">${escapeHtml(food.name)}</span><span class="food-meta">${escapeHtml(food.serving)} · K ${fmt(food.carbs,1)}g · P ${fmt(food.protein,1)}g · L ${fmt(food.fat,1)}g</span></span></span><span class="result-kcal">${fmt(food.kcal)} <small>kkal</small></span></button>`).join('')}
      function renderHistory(){const keys=Array.from({length:7},(_,index)=>shiftDate(today,index-6)),values=keys.map(key=>totals(entries.filter(entry=>entry.date===key)).kcal),max=Math.max(profile.calories,...values,1),mean=values.reduce((sum,value)=>sum+value,0)/values.length,reached=values.filter(value=>value>=profile.calories*.9&&value<=profile.calories*1.1).length,macroTotals=totals(entries.filter(entry=>keys.includes(entry.date)));app.innerHTML=`<div class="page-heading"><div><p class="eyebrow">Konsistensi dan tren</p><h1>Riwayat</h1></div><span class="subtle">7 hari terakhir</span></div><section class="panel view-panel"><h2>Asupan kalori</h2><p class="help-text">Garis putus-putus menunjukkan target ${fmt(profile.calories)} kkal.</p><div class="chart" role="img" aria-label="Grafik asupan kalori tujuh hari terakhir">${keys.map((key,index)=>{const height=Math.max(values[index]?3:0,Math.min(100,values[index]/max*100)),targetLine=Math.min(100,profile.calories/max*100);return`<div class="chart-day"><span class="chart-value">${values[index]?fmt(values[index]):'–'}</span><div class="bar-area"><span class="bar-target" style="bottom:${targetLine}%"></span><span class="bar" style="height:${height}%"></span></div><span class="chart-label">${escapeHtml(new Intl.DateTimeFormat('id-ID',{weekday:'short'}).format(fromKey(key)))}</span></div>`}).join('')}</div><div class="stats-grid">${statCard('Rata-rata',Math.round(mean),'kkal/hari')}${statCard('Hari tercatat',values.filter(value=>value>0).length,'dari 7 hari')}${statCard('Dekat target',reached,'hari')}</div></section><section class="panel view-panel"><h2>Rata-rata makro</h2><p class="help-text">Total asupan makro dalam 7 hari terakhir.</p><div class="macro-grid">${macroCard('Karbo',macroTotals.carbs/7,profile.carbs)}${macroCard('Protein',macroTotals.protein/7,profile.protein)}${macroCard('Lemak',macroTotals.fat/7,profile.fat)}</div></section><section class="panel view-panel"><h2>Pilih tanggal</h2><p class="help-text">Ketuk t       function renderProfile(){app.innerHTML=`<div class="page-heading"><div><p class="eyebrow">Data pribadi dan kebutuhan</p><h1>Profil & target</h1></div></div><section class="panel view-panel"><div class="profile-summary"><span class="avatar" aria-hidden="true">${profile.name?escapeHtml(profile.name.trim().charAt(0).toUpperCase()):'N'}</span><div><strong>${escapeHtml(profile.name||'Profil saya')}</strong><span>${profile.mode==='automatic'?'Target dihitung dari profil tubuh':'Target kalori dan makro'}</span></div></div><form id="profile-form"><h2 style="margin:18px 0 13px">Data tubuh</h2><div class="form-grid"><div class="field"><label for="profile-name">Nama (opsional)</label><input id="profile-name" name="name" value="${escapeHtml(profile.name||'')}" autocomplete="name" placeholder="Nama Anda"></div><div class="field"><label for="profile-sex">Jenis kelamin untuk rumus</label><select id="profile-sex" name="sex"><option value="female" ${profile.sex==='female'?'selected':''}>Wanita</option><option value="male" ${profile.sex==='male'?'selected':''}>Pria</option></select></div><div class="field"><label for="profile-age">Usia</label><input id="profile-age" name="age" type="number" min="1" max="120" value="${profile.age||''}" placeholder="Tahun"></div><div class="field"><label for="profile-height">Tinggi badan</label><input id="profile-height" name="height" type="number" min="80" max="250" step="0.1" value="${profile.height||''}" placeholder="cm"></div><div class="field"><label for="profile-weight">Berat badan</label><input id="profile-weight" name="weight" type="number" min="20" max="350" step="0.1" value="${profile.weight||''}" placeholder="kg"></div><div class="field"><label for="profile-activity">Tingkat aktivitas</label><select id="profile-activity" name="activity"><option value="1.2" ${profile.activity==='1.2'?'selected':''}>Sangat jarang bergerak</option><option value="1.375" ${profile.activity==='1.375'?'selected':''}>Ringan (1-3x/minggu)</option><option value=       function openEntry(food,mealId=meals[0].id,entry=null){if(!food&&!entry)return;const quantity=entry?.quantity||1,base=entry?{...entry,kcal:entry.kcal/quantity,carbs:entry.carbs/quantity,protein:entry.protein/quantity,fat:entry.fat/quantity}:food;document.getElementById('entry-title').textContent=entry?'Ubah catatan':'Tambah makanan';document.getElementById('entry-form-container').innerHTML=`<form id="entry-form" data-entry-id="${entry?.id||''}"><div class="form-grid"><div class="field full"><label for="entry-name">Nama makanan</label><input id="entry-name" name="name" required maxlength="80" value="${escapeHtml(base.name)}"></div><div class="field full"><label for="entry-serving">Takaran porsi</label><input id="entry-serving" name="serving" required maxlength="80" value="${escapeHtml(base.serving||'1 porsi')}"></div><div class="field"><label for="entry-quantity">Jumlah porsi</label><input id="entry-quantity" name="quantity" type="number" min="0.1" max="100" step="0.1" value="${quantity}" required></div><div class="field"><label for="entry-meal">Waktu makan</label><select id="entry-meal" name="meal">${meals.map(item=>`<option value="${item.id}" ${(entry?.meal||mealId)===item.id?'selected':''}>${item.name}</option>`).join('')}</select></div><div class="field"><label for="entry-kcal">Kalori per porsi</label><input id="entry-kcal" name="kcal" type="number" min="0" step="0.1" value="${base.kcal}" required></div><div class="field"><label for="entry-carbs">Karbo (g/porsi)</label><input id="entry-carbs" name="carbs" type="number" min="0" step="0.1" value="${base.carbs}" required></div><div class="field"><label for="entry-protein">Protein (g/porsi)</label><input id="entry-protein" name="protein" type="number" min="0" step="0.1" value="${base.protein}" required></div><div class="field"><label for="entry-fat">Lemak (g/porsi)</label><input id="entry-fat" name="fat" type="number" min="0" step="0.1" value="${base.fat}" required></div></div><div class="live-total" id="entry-       function updateEntryPreview(){const form=document.getElementById('entry-form');if(!form)return;const quantity=Number(form.elements.quantity.value)||0,values=['kcal','carbs','protein','fat'].map(key=>(Number(form.elements[key].value)||0)*quantity);document.getElementById('entry-live-total').innerHTML=`Total porsi: ${fmt(values[0])} kkal <span>K ${fmt(values[1],1)} g</span><span>P ${fmt(values[2],1)} g</span><span>L ${fmt(values[3],1)} g</span>`}

      function calculateTarget(form){const age=Number(form.elements.age.value),height=Number(form.elements.height.value),weight=Number(form.elements.weight.value);if(!age||!height||!weight){showToast('Isi usia, tinggi, dan berat untuk menghitung target.');return null}if(age<18||form.elements.healthWarning.checked){document.getElementById('profile-notice').innerHTML='<p class="notice warning"><strong>Perlu perhatian:</strong> kalkulator ini untuk orang dewasa umum. Konsultasikan dengan tenaga kesehatan untuk kondisi khusus; kami tidak menyarankan target otomatis.</p>';return null}const sex=form.elements.sex.value,activity=Number(form.elements.activity.value),goal=form.elements.goal.value,bmr=10*weight+6.25*height-5*age+(sex==='male'?5:-161),tdee=bmr*activity,minimum=sex==='male'?1500:1200,calories=Math.max(minimum,tdee+(goal==='lose'?-400:goal==='gain'?300:0)),presets={balanced:[.5,.25,.25],protein:[.4,.35,.25],lowcarb:[.3,.3,.4]},split=presets[form.elements.preset.value]||[.5,.25,.25],result={calories:Math.round(calories),carbs:Math.round(calories*split[0]/4),protein:Math.round(calories*split[1]/4),fat:Math.round(calories*split[2]/9)};form.elements.calories.value=result.calories;form.elements.carbs.value=result.carbs;form.elements.protein.value=result.protein;form.elements.fat.value=result.fat;document.getElementById('profile-notice').innerHTML=`<p class="notice"><strong>Perkiraan:</strong> BMR ${fmt(bmr,1)} kkal · TDEE ${fmt(tdee)} kkal. Target ${fmt(result.calories)} kkal dengan pembagian makro terpilih. Hasil bukan saran medis.${calories===minimum?' Batas minimum aman otomatis diterapkan.':''}</p>`;return result}
      function openCustom(){document.getElementById('custom-form-container').innerHTML=`<form id="custom-form"><div class="form-grid"><div class="field full"><label for="custom-name">Nama makanan</label><input id="custom-name" name="name" required maxlength="80" placeholder="Contoh: Nasi uduk"></div><div class="field full"><label for="custom-serving">Takaran per porsi</label><input id="custom-serving" name="serving" required maxlength="80" value="1 porsi"></div><div class="field"><label for="custom-kcal">Kalori (kkal)</label><input id="custom-kcal" name="kcal" type="number" min="0" step="0.1" required></div><div class="field"><label for="custom-carbs">Karbo (g)</label><input id="custom-carbs" name="carbs" type="number" min="0" step="0.1" required></div><div class="field"><label for="custom-protein">Protein (g)</label><input id="custom-protein" name="protein" type="number" min="0" step="0.1" required></div><div class="field"><label for="custom-fat">Lemak (g)</label><input id="custom-fat" name="fat" type="number" min="0" step="0.1" required></div></div><p class="help-text" style="margin:12px 0 0">Kalori dari makro diperkirakan dengan rumus 4K + 4P + 9L. Selisih besar akan diberi pengingat.</p><div class="form-actions"><button class="primary-btn" type="submit">Simpan dan catat</button><button class="secondary-btn" type="button" data-close-dialog>Batal</button></div></form>`;customDialog.showModal()}
      function decorateFoodResults(){app.querySelectorAll('.food-result').forEach(button=>{if(button.parentElement.classList.contains('food-result-wrap'))return;const id=button.dataset.selectFood,wrap=document.createElement('div'),toggle=document.createElement('button');wrap.className='food-result-wrap';button.before(wrap);wrap.append(button);toggle.type='button';toggle.className='favorite-toggle';toggle.dataset.toggleFavorite=id;toggle.setAttribute('aria-pressed',String(favorites.includes(id)));toggle.setAttribute('aria-label',`${favorites.includes(id)?'Hapus dari':'Tambahkan ke'} favorit`);toggle.title=toggle.getAttribute('aria-label');toggle.textContent=favorites.includes(id)?'★':'☆';wrap.append(toggle)})}
      const foodObserver=new MutationObserver(decorateFoodResults);foodObserver.observe(app,{childList:true,subtree:true});
      document.addEventListener('click',event=>{
        const favorite=event.target.closest('[data-toggle-favorite]');if(favorite){const id=favorite.dataset.toggleFavorite;favorites=favorites.includes(id)?favorites.filter(item=>item!==id):[...favorites,id];writeStore('nutricalc.favorites.v1',favorites);if(activeFilter==='favorit')renderLogView();else{favorite.setAttribute('aria-pressed',String(favorites.includes(id)));favorite.textContent=favorites.includes(id)?'★':'☆';favorite.setAttribute('aria-label',`${favorites.includes(id)?'Hapus dari':'Tambahkan ke'} favorit`)}return}
        const viewButton=event.target.closest('[data-view]');if(viewButton){if(viewButton.dataset.closeDialog!==undefined)viewButton.closest('dialog')?.close();setView(viewButton.dataset.view);return}
        const close=event.target.closest('[data-close-dialog]');if(close){close.closest('dialog')?.close();return}
        const shift=event.target.closest('[data-date-shift]');if(shift){selectedDate=shiftDate(selectedDate,Number(shift.dataset.dateShift));render();return}
        if(event.target.closest('[data-date-today]')){selectedDate=today;render();return}
        const toggle=event.target.closest('[data-toggle-meal]');if(toggle){const id=toggle.dataset.toggleMeal;openMeals.has(id)?openMeals.delete(id):openMeals.add(id);render();return}
        const add=event.target.closest('[data-add-meal]');if(add){setView('catat');window.setTimeout(()=>{const search=document.getElementById('food-search');search?.focus();search?.setAttribute('data-meal',add.dataset.addMeal)},0);return}
        const selected=event.target.closest('[data-select-food]');if(selected){const food=allFoods().find(item=>item.id===selected.dataset.selectFood);openEntry(food,document.getElementById('food-search')?.dataset.meal||meals[0].id);return}
        const filter=event.target.closest('[data-filter]');if(filter){activeFilter=filter.dataset.filter;renderLogView();return}
        const edit=event.target.closest('[data-edit-entry]');if(edit){const entry=entries.find(item=>item.id===edit.dataset.editEntry);if(entry)openEntry(entry,entry.meal,entry);return}
        const remove=event.target.closest('[data-delete-entry]');if(remove){undoEntry=entries.find(item=>item.id===remove.dataset.deleteEntry);entries=entries.filter(item=>item.id!==remove.dataset.deleteEntry);writeStore(STORE.entries,entries);render();showToast('Catatan dihapus.',true);return}
        if(event.target.closest('#undo-delete')&&undoEntry){entries.push(undoEntry);writeStore(STORE.entries,entries);undoEntry=null;render();document.getElementById('toast-slot').replaceChildren();return}
        if(event.target.closest('[data-open-custom]')){openCustom();return}
        if(event.target.closest('[data-open-scan]')){document.getElementById('scan-dialog').showModal();return}
        const historyDate=event.target.closest('[data-history-date]');if(historyDate){selectedDate=historyDate.dataset.historyDate;setView('harian');return}
        if(event.target.closest('#calculate-target')){const form=document.getElementById('profile-form');if(form)calculateTarget(form);return}
        if(event.target.closest('#export-data')){const blob=new Blob([JSON.stringify({profile,entries,customFoods},null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`nutricalc-${today}.json`;link.click();URL.revokeObjectURL(link.href);return}
        if(event.target.closest('#clear-data')&&confirm('Hapus semua catatan makanan dari perangkat ini? Profil dan target tidak akan dihapus.')){entries=[];writeStore(STORE.entries,entries);render();showToast('Semua catatan telah dihapus.')}
      });
      document.addEventListener('input',event=>{if(event.target.id==='food-search'){const cursor=event.target.selectionStart,value=event.target.value,results=document.getElementById('food-results');results.innerHTML=renderFoodResults(allFoods().filter(food=>food.name.toLocaleLowerCase('id').includes(value.toLocaleLowerCase('id'))||(food.aliases||[]).some(alias=>alias.toLocaleLowerCase('id').includes(value.toLocaleLowerCase('id')))));event.target.focus();event.target.setSelectionRange(cursor,cursor)}if(event.target.closest('#entry-form'))updateEntryPreview()});
      document.addEventListener('submit',event=>{
        if(event.target.id==='entry-form'){event.preventDefault();const form=event.target,data=new FormData(form),quantity=Number(data.get('quantity')),entryId=form.dataset.entryId,existing=entries.find(entry=>entry.id===entryId),item={id:entryId||makeId(),foodId:existing?.foodId||'custom-entry',name:String(data.get('name')).trim(),serving:String(data.get('serving')).trim(),meal:data.get('meal'),date:data.get('date'),quantity,kcal:Number(data.get('kcal'))*quantity,carbs:Number(data.get('carbs'))*quantity,protein:Number(data.get('protein'))*quantity,fat:Number(data.get('fat'))*quantity,createdAt:Date.now()};if(entryId)entries=entries.map(entry=>entry.id===entryId?item:entry);else entries.push(item);writeStore(STORE.entries,entries);selectedDate=item.date;entryDialog.close();activeView='harian';render();showToast(entryId?'Catatan diperbarui.':'Makanan ditambahkan ke jurnal.')}
        if(event.target.id==='custom-form'){event.preventDefault();const data=new FormData(event.target),food={id:makeId(),name:String(data.get('name')).trim(),serving:String(data.get('serving')).trim(),kcal:Number(data.get('kcal')),carbs:Number(data.get('carbs')),protein:Number(data.get('protein')),fat:Number(data.get('fat')),icon:'◍',custom:true},energy=food.carbs*4+food.protein*4+food.fat*9;customFoods.push(food);writeStore(STORE.custom,customFoods);customDialog.close();openEntry(food,meals[0].id);if(Math.abs(energy-food.kcal)>Math.max(50,food.kcal*.25))showToast('Periksa kembali kalori dan makro makanan kustom.')}
        if(event.target.id==='profile-form'){event.preventDefault();const data=new FormData(event.target);profile={...profile,name:String(data.get('name')).trim(),sex:data.get('sex'),age:Number(data.get('age'))||null,height:Number(data.get('height'))||null,weight:Number(data.get('weight'))||null,activity:data.get('activity'),goal:data.get('goal'),preset:data.get('preset'),healthWarning:data.get('healthWarning')==='on',calories:Number(data.get('calories')),carbs:Number(data.get('carbs')),protein:Number(data.get('protein')),fat:Number(data.get('fat')),mode:'manual'};if([profile.calories,profile.carbs,profile.protein,profile.fat].some(value=>!Number.isFinite(value)||value<0)){showToast('Target harus berupa angka nol atau lebih.');return}const floor=profile.sex==='male'?1500:1200,note=profile.calories<floor?`<p class="notice warning"><strong>Perhatian:</strong> target berada di bawah batas minimum umum ${fmt(floor)} kkal. Sebaiknya konsultasikan dengan tenaga kesehatan.</p>`:'';writeStore(STORE.profile,profile);render();document.getElementById('profile-notice').innerHTML=note;showToast('Profil dan target disimpan.')}
      });
      render();
    })();
  </script>
